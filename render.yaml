# Render Blueprint: New > Blueprint > pick this repo. Secrets marked sync: false are entered
# in the Render dashboard and never stored in git.
services:
  - type: web
    name: agentwall
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn agentwall.server:app --host 0.0.0.0 --port $PORT --no-server-header --timeout-graceful-shutdown 5
    healthCheckPath: /api/lab/status
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.4"
      - key: AGENTWALL_PUBLIC
        value: "1"
      - key: TRUST_PROXY
        value: cloudflare
      - key: LLM_PROVIDER
        value: featherless
      - key: FEATHERLESS_MODEL
        value: Qwen/Qwen2.5-72B-Instruct
      - key: LAB_LIVE
        value: "1"
      - key: LAB_LIVE_RUNS_PER_DAY
        value: "40"
      - key: LAB_RUNS_PER_IP_PER_HOUR
        value: "6"
      - key: DASHBOARD_ACTIONS_PER_HOUR
        value: "60"
      - key: AGENTWALL_ALLOWED_ORIGINS
        value: https://agentwall.onrender.com
      - key: FEATHERLESS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AGENTBOXD_API_KEY
        sync: false
      - key: AGENTBOXD_INBOX_ID
        sync: false
      - key: AGENTBOXD_INBOX_ADDRESS
        sync: false
